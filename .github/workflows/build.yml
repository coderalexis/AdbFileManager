name: Build and test
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build AdbFileManager.sln --configuration Release
      - run: dotnet format whitespace AdbFileManager.sln --verify-no-changes --no-restore
      - run: dotnet build src/AdbFileManager.WinForms/AdbFileManager.WinForms.csproj --configuration Release -p:Platform=x64
      - run: dotnet test tests/AdbFileManager.Tests/AdbFileManager.Tests.csproj --configuration Release --no-build
      - name: Check Windows Forms resources and interactions
        shell: pwsh
        run: ./scripts/ui-smoke.ps1
      - name: Build portable Windows x64 package
        shell: pwsh
        run: ./scripts/publish-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AdbFileManager-win-x64
          path: |
            artifacts/AdbFileManager-win-x64.zip
            artifacts/AdbFileManager-win-x64.zip.sha256
          if-no-files-found: error
